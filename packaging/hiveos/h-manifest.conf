# HiveOS custom miner manifest for the third-party Quantus quantus-miner.
# Never define wallet, pool or certificate values here.
CUSTOM_NAME=quanminer
CUSTOM_VERSION=4.0.2
CUSTOM_BUILD=1
CUSTOM_BUILD_TARGETS="GPU_NVIDIA CPU"
CUSTOM_DESCRIPTION="Third-party Quantus quantus-miner (upstream) (QUIC/UDP) packaged for HiveOS"
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/quanminer/quanminer.conf
CUSTOM_LOG_BASENAME=/var/log/miner/custom/quanminer/quanminer
CUSTOM_API_PORT=4067
MINER_NAME=$CUSTOM_NAME
MINER_VERSION=$CUSTOM_VERSION
MINER_CONFIG_FILENAME=$CUSTOM_CONFIG_FILENAME
